openapi: 3.1.0
info:
  title: X-SENTINEL API
  version: 0.1.0-baseline
paths:
  /health:
    get:
      responses:
        '200': {description: OK}
  /ready:
    get:
      responses:
        '200': {description: readiness status}
  /v1/analyze/vector:
    post:
      summary: Analyze a 2381-feature EMBER vector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorAnalysisRequest'
      responses:
        '200':
          description: Analysis result
        '409':
          description: Scientific configuration unresolved
        '422':
          description: Invalid vector/request
components:
  schemas:
    VectorAnalysisRequest:
      type: object
      required: [features]
      properties:
        request_id: {type: [string, 'null']}
        source_name: {type: [string, 'null']}
        features:
          type: array
          minItems: 2381
          maxItems: 2381
          items: {type: number}

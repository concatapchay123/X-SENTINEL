openapi: 3.1.0
info:
  title: X-SENTINEL Jev AI V3 Fragment
  version: 0.3.0
paths:
  /v1/ai/status:
    get:
      tags:
      - AI Advisory
      summary: Get Jev AI LM Studio status
      operationId: ai_status_v1_ai_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevStatusResponse'
  /v1/ai/explain:
    post:
      tags:
      - AI Advisory
      summary: Execute Jev AI advisory workflow (explain, triage, compare, report)
      operationId: execute_jev_ai_workflow_v1_ai_explain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JevExplainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevAIRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/ai/runs:
    get:
      tags:
      - AI Advisory
      summary: List persisted Jev AI advisory runs
      operationId: list_jev_ai_runs_v1_ai_runs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: analysis_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by analysis job UUID or request_id
          title: Analysis Id
        description: Filter by analysis job UUID or request_id
      - name: mode
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - explain
            - triage
            - compare
            - report
            - docs
            type: string
          - type: 'null'
          description: Filter by workflow mode
          title: Mode
        description: Filter by workflow mode
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - queued
            - running
            - completed
            - failed
            - blocked
            type: string
          - type: 'null'
          description: Filter by run status
          title: Status
        description: Filter by run status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page limit
          default: 50
          title: Limit
        description: Page limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Page offset
          default: 0
          title: Offset
        description: Page offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevAIRunListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ai/runs/{run_id}:
    get:
      tags:
      - AI Advisory
      summary: Get persisted Jev AI run by UUID
      operationId: get_jev_ai_run_v1_ai_runs__run_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevAIRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ai/runs/{run_id}/feedback:
    post:
      tags:
      - AI Advisory
      summary: Record analyst feedback for a terminal Jev AI run
      operationId: create_jev_ai_feedback_v1_ai_runs__run_id__feedback_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JevFeedbackRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevFeedbackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - AI Advisory
      summary: List analyst feedback records for a Jev AI run
      operationId: list_jev_ai_feedback_v1_ai_runs__run_id__feedback_get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JevFeedbackListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ai/docs/ask:
    post:
      tags:
      - AI Advisory
      summary: Documentation QA over repository docs (Phase 2 Gated)
      operationId: ask_jev_ai_docs_v1_ai_docs_ask_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
components:
  schemas:
    JevAIRunListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/JevAIRunResponse'
          type: array
          title: Items
          description: List of persisted Jev AI runs
        total:
          type: integer
          title: Total
          description: Total count of matching Jev AI runs
        limit:
          type: integer
          title: Limit
          description: Query page limit
        offset:
          type: integer
          title: Offset
          description: Query page offset
      type: object
      required:
      - total
      - limit
      - offset
      title: JevAIRunListResponse
    JevAIRunResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique Jev AI run UUID
        analysis_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Analysis Job Id
          description: Associated canonical analysis job UUID
        requested_by_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested By User Id
          description: UUID of the authenticated user who initiated the run
        mode:
          type: string
          enum:
          - explain
          - triage
          - compare
          - report
          - docs
          title: Mode
          description: Executed Jev AI workflow mode
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - blocked
          title: Status
          description: Run lifecycle status
        advisory_only:
          type: boolean
          const: true
          title: Advisory Only
          description: 'Mandatory invariant: Jev AI outputs are strictly advisory'
          default: true
        authoritative_decision_unchanged:
          type: boolean
          const: true
          title: Authoritative Decision Unchanged
          description: Confirms canonical detector verdict and evidence were not modified
          default: true
        model_id:
          type: string
          title: Model Id
          description: LM Studio model identifier
        endpoint_label:
          type: string
          title: Endpoint Label
          description: Sanitized local runtime endpoint label
        prompt_version:
          type: string
          title: Prompt Version
          description: Prompt contract version
        input_digest_sha256:
          type: string
          title: Input Digest Sha256
          description: 64-character lowercase hex SHA-256 digest of safe input context
        output_digest_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Digest Sha256
          description: 64-character lowercase hex SHA-256 digest of advisory output
        context_summary:
          additionalProperties: true
          type: object
          title: Context Summary
          description: Sanitized allowlisted context summary
        response_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Text
          description: Persisted advisory summary text (omitted if retention policy
            disables text storage)
        decision_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Decision Result
          description: Structured workflow decision output
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
          description: Inference execution latency in milliseconds
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: Canonical error code if run failed/blocked
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Sanitized error description if run failed/blocked
        created_at:
          type: string
          title: Created At
          description: ISO 8601 UTC creation timestamp
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
          description: ISO 8601 UTC completion timestamp
      type: object
      required:
      - id
      - mode
      - status
      - model_id
      - endpoint_label
      - prompt_version
      - input_digest_sha256
      - created_at
      title: JevAIRunResponse
    JevExplainRequest:
      properties:
        analysis_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Analysis Id
          description: Target analysis job UUID or request_id
        mode:
          type: string
          maxLength: 32
          minLength: 1
          title: Mode
          description: 'Jev AI workflow mode: explain, triage, compare, report, or
            docs'
          default: explain
        compare_with_analysis_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Compare With Analysis Id
          description: Second analysis job UUID or request_id required when mode is
            'compare'
        focus_signals:
          anyOf:
          - items:
              type: string
              enum:
              - m1
              - m2
              - m3
              - m4
              - m5
            type: array
            maxItems: 5
          - type: 'null'
          title: Focus Signals
          description: Optional subset of detector signals (m1 through m5) to highlight
        question:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Question
          description: Optional analyst question for the explain workflow
      additionalProperties: false
      type: object
      required:
      - analysis_id
      title: JevExplainRequest
    JevFeedbackListResponse:
      properties:
        jev_ai_run_id:
          type: string
          title: Jev Ai Run Id
          description: Target Jev AI run UUID
        total:
          type: integer
          title: Total
          description: Total feedback records for this run
        items:
          items:
            $ref: '#/components/schemas/JevFeedbackResponse'
          type: array
          title: Items
          description: Ordered list of feedback items
      type: object
      required:
      - jev_ai_run_id
      - total
      title: JevFeedbackListResponse
    JevFeedbackRequest:
      properties:
        rating:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rating
          description: Optional integer usefulness rating from 1 (lowest) to 5 (highest)
        label:
          anyOf:
          - type: string
            enum:
            - helpful
            - not_helpful
            - incorrect
            - unsafe
            - unclear
          - type: 'null'
          title: Label
          description: Optional structured classification label
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
          description: Optional analyst feedback comment (max 2,000 characters)
      additionalProperties: false
      type: object
      title: JevFeedbackRequest
    JevFeedbackResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique feedback UUID
        jev_ai_run_id:
          type: string
          title: Jev Ai Run Id
          description: Associated Jev AI run UUID
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: UUID of the analyst who submitted feedback
        rating:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rating
          description: Integer rating in [1, 5]
        label:
          anyOf:
          - type: string
            enum:
            - helpful
            - not_helpful
            - incorrect
            - unsafe
            - unclear
          - type: 'null'
          title: Label
          description: Structured classification label
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          description: Sanitized analyst comment
        advisory_only:
          type: boolean
          const: true
          title: Advisory Only
          description: Confirms feedback is advisory telemetry only and never alters
            detector verdicts
          default: true
        created_at:
          type: string
          title: Created At
          description: ISO 8601 UTC creation timestamp
      type: object
      required:
      - id
      - jev_ai_run_id
      - created_at
      title: JevFeedbackResponse
    JevStatus:
      type: string
      enum:
      - disabled
      - available
      - unavailable
      - degraded
      - misconfigured
      title: JevStatus
    JevStatusResponse:
      properties:
        enabled:
          type: boolean
          title: Enabled
        status:
          $ref: '#/components/schemas/JevStatus'
        advisory_only:
          type: boolean
          title: Advisory Only
          default: true
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        prompt_version:
          type: string
          title: Prompt Version
        endpoint_label:
          type: string
          title: Endpoint Label
          default: lm_studio_local
        readiness_blocking:
          type: boolean
          title: Readiness Blocking
          default: false
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - enabled
      - status
      - prompt_version
      title: JevStatusResponse

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-sentinel"
version = "0.3.0"
description = "X-SENTINEL V3: cross-view backdoor detection with optional local Jev AI collaboration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "lightgbm>=4.5,<5",
  "shap>=0.46,<1",
  "streamlit>=1.39,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pyodbc>=5.0,<6",
  "psycopg[binary]>=3.2,<4",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "-ra"
pythonpath = ["backend/src"]
markers = [
  "db: requires a live PostgreSQL database",
  "integration: integration test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
